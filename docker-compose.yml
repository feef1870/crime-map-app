version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: crime_db
    restart: always
    environment:
      - TZ=Europe/Warsaw
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: crime_backend
    restart: always
    environment:
      - TZ=Europe/Warsaw
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: crime_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata: